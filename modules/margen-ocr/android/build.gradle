plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.margenocr'
version = '0.1.0'
android {
  namespace 'expo.modules.margenocr'
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}
dependencies {
  // Modelo latino incluido en el APK: no se envían capturas a una API remota.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  testImplementation 'junit:junit:4.13.2'
}
